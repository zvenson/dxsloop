# sloopDX site (dx7.designburgapps.com), the entry page (designburgapps.com) and zp12 (zp12.designburgapps.com): nginx serves repo/docs,
# repo/deploy/designburgapps and zp12repo/docs, its own
# cloudflared tunnel "sloopdx-site" (a12c4308-c70e-4908-9a2e-47c578d83948) reaches it on the compose network.
#   update: ./update.sh (git pull; the folder is a bind mount)
services:
  web:
    image: nginx:alpine
    container_name: sloopdx-site
    restart: unless-stopped
    volumes:
      - ./repo/docs:/usr/share/nginx/html:ro
      - ./repo/deploy/designburgapps:/usr/share/nginx/apex:ro
      - ./zp12repo/docs:/usr/share/nginx/zp12:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-sloopdx
    user: "1000:1000"                       # zven: may read its own credentials file
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - /home/zven/.cloudflared/a12c4308-c70e-4908-9a2e-47c578d83948.json:/etc/cloudflared/a12c4308-c70e-4908-9a2e-47c578d83948.json:ro
    depends_on: [web]
