server {
    listen 80;
    server_name dx7.designburgapps.com;
    if ($http_cf_visitor ~ '"scheme":"http"') { return 301 https://$host$request_uri; }   # (always https: Cloudflare says how the visitor came)
    add_header Strict-Transport-Security "max-age=31536000" always;
    root /usr/share/nginx/html;
    index index.html;
    # every page and the package are revalidated: a new release must show at once (no stale installer)
    add_header Cache-Control "no-cache" always;
    location /zp12 { return 301 https://zp12.designburgapps.com/; }   # (the old copy of zp12 here: gone, its own site)
    location / { try_files $uri $uri/ =404; }
}
# designburgapps.com: the entry page (repo deploy/designburgapps); www goes to the bare domain
server {
