server {
    listen 80;
    server_name www.designburgapps.com;
    if ($http_cf_visitor ~ '"scheme":"http"') { return 301 https://$host$request_uri; }   # (always https: Cloudflare says how the visitor came)
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://designburgapps.com$request_uri;
}
# fm1.designburgapps.com: the FM-1 firmware switcher (the zvenson/zp12 repo fm1/), the source copies in /src/ (fm1src, outside git)
server {
    listen 80;
    server_name fm1.designburgapps.com;
    if ($http_cf_visitor ~ '"scheme":"http"') { return 301 https://$host$request_uri; }   # (always https: Cloudflare says how the visitor came)
    add_header Strict-Transport-Security "max-age=31536000" always;
    root /usr/share/nginx/fm1;
    index index.html;
    add_header Cache-Control "no-cache" always;
    location /src/ { alias /usr/share/nginx/fm1src/; autoindex on; }
    location = /catalog.json { alias /usr/share/nginx/fm1live/catalog.json; }   # (fm1live: the nightly fm1_sync, outside git)
    location /fw/ { alias /usr/share/nginx/fm1live/fw/; }
    location / { try_files $uri $uri/ =404; }
}
