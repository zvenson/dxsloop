server {
    listen 80;
    server_name dx7.designburgapps.com;
    root /usr/share/nginx/html;
    index index.html;
    # the package: one static file, cached by the edge but revalidated (a new build must show at once)
    location /firmware/ { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }
    types { application/octet-stream fwsc; }
    include /etc/nginx/mime.types;
}
