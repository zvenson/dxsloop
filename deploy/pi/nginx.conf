# fm1.designburgapps.com: the FM-1 firmware switcher (the zvenson/zp12 repo fm1/), the source copies in /src/ (fm1src, outside git)
server {
    listen 80;
    server_name fm1.designburgapps.com;
    if ($http_cf_visitor ~ '"scheme":"http"') { return 301 https://$host$request_uri; }   # (always https: Cloudflare says how the visitor came)
    add_header Strict-Transport-Security "max-age=31536000" always;
    root /usr/share/nginx/fm1;
    index index.html;
    add_header Cache-Control "no-cache" always;
    location /src/ { alias /usr/share/nginx/fm1src/; autoindex on; }
    location = /catalog.json {                                                  # (fm1live: the nightly fm1_sync, outside git;
        alias /usr/share/nginx/fm1live/catalog.json;                            #  thefirmwarehub.com reads the count and the screens)
        add_header Access-Control-Allow-Origin "https://thefirmwarehub.com" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "no-cache" always;
    }
    location /fw/ { alias /usr/share/nginx/fm1live/fw/; }
    location / { try_files $uri $uri/ =404; }
}
# thefirmwarehub.com: the start page, a card per device (zvenson/zp12 repo firmwarehub/); www -> the apex
server {
    listen 80;
    server_name thefirmwarehub.com;
    if ($http_cf_visitor ~ '"scheme":"http"') { return 301 https://$host$request_uri; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    root /usr/share/nginx/firmwarehub;
    index index.html;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 80;
    server_name www.thefirmwarehub.com;
    return 301 https://thefirmwarehub.com$request_uri;
}
