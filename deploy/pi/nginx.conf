server {
    listen 80;
    server_name dx7.designburgapps.com;
    root /usr/share/nginx/html;
    index index.html;
    # every page and the package are revalidated: a new release must show at once (no stale installer)
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
}
# designburgapps.com: the entry page (repo deploy/designburgapps); www goes to the bare domain
server {
    listen 80;
    server_name designburgapps.com;
    root /usr/share/nginx/apex;
    index index.html;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
}
# zp12.designburgapps.com: zp12's site (the zvenson/zp12 repo's docs/, cloned on the Pi as zp12repo)
server {
    listen 80;
    server_name zp12.designburgapps.com;
    root /usr/share/nginx/zp12;
    index index.html;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 80;
    server_name www.designburgapps.com;
    return 301 https://designburgapps.com$request_uri;
}
